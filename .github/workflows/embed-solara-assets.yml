name: Embed Solara assets

on:
  push:
    paths:
      - '.github/workflows/embed-solara-assets.yml'

permissions:
  contents: write

jobs:
  embed-solara-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --quiet Pillow

      - name: Convert and embed Solara photography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from io import BytesIO
          from PIL import Image
          import base64

          target = Path('templates/solara-stays/index.html')
          html = target.read_text(encoding='utf-8')

          urls = [
              'https://images.pexels.com/photos/30781823/pexels-photo-30781823.jpeg?cs=srgb&dl=pexels-aksinfo7-30781823.jpg&fm=jpg',
              'https://images.pexels.com/photos/24805054/pexels-photo-24805054.jpeg?cs=srgb&dl=pexels-ahmetcotur-24805054.jpg&fm=jpg',
              'https://images.pexels.com/photos/26859048/pexels-photo-26859048.jpeg?cs=srgb&dl=pexels-ahmetcotur-26859048.jpg&fm=jpg',
          ]

          for index, url in enumerate(urls, 1):
              if url not in html:
                  raise SystemExit(f'Expected Solara image URL not found: {url}')
              req = Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; SenthanCoBuild/1.0)',
                  'Accept': 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
              })
              with urlopen(req, timeout=90) as response:
                  raw = response.read()
              image = Image.open(BytesIO(raw)).convert('RGB')
              image.thumbnail((1600, 1200), Image.Resampling.LANCZOS)
              out = BytesIO()
              image.save(out, format='WEBP', quality=82, method=6)
              encoded = base64.b64encode(out.getvalue()).decode('ascii')
              html = html.replace(url, 'data:image/webp;base64,' + encoded)
              print(f'Embedded image {index}: {len(out.getvalue()):,} bytes WebP')

          if 'https://images.pexels.com/' in html:
              raise SystemExit('Remote Pexels image URL remains in Solara HTML')
          if html.count('data:image/webp;base64,') < 6:
              raise SystemExit('Expected embedded WebP references were not produced')

          target.write_text(html, encoding='utf-8')
          print(f'Updated {target} ({target.stat().st_size:,} bytes)')
          PY

      - name: Commit embedded build
        shell: bash
        run: |
          if git diff --quiet -- templates/solara-stays/index.html; then
            echo 'No Solara changes to commit.'
            exit 0
          fi
          git config user.name 'Senthan & Co Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/solara-stays/index.html
          git commit -m 'Embed Solara imagery as Base64 WebP'
          git push
