let lang='en';const $=id=>document.getElementById(id);const t=k=>I18N[lang][k]||I18N.en[k]||k;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function options(el,arr){let selected=el.value;el.innerHTML=arr.map(([v,label])=>`<option value="${esc(v)}">${esc(label)}</option>`).join('');if(arr.some(x=>x[0]===selected))el.value=selected}
function renderProjects(){$('projectGrid').innerHTML=projects.map((p,i)=>`<article class="project reveal in"><div class="project-photo"><img src="${p.photo}" alt="${esc(t(p.place))}" loading="lazy"><span class="tag">${esc(t(p.stage))}</span></div><div class="project-body"><span class="eyebrow">0${i+1} / 03</span><h3>${p.name}</h3><p>${esc(t(p.place))}</p><p>${esc(t(p.body))}</p><div class="meta"><span>${p.count} ${esc(t('statHomes'))}</span><a href="#homes" data-project="${i}" class="project-link">${esc(t('viewUnit'))}</a></div></div></article>`).join('');document.querySelectorAll('.project-link').forEach(a=>a.onclick=()=>{$('fProject').value=a.dataset.project;renderUnits()})}
function renderFilters(){options($('fProject'),[['',t('allProjects')],...projects.map((p,i)=>[String(i),p.name])]);options($('fType'),[['',t('allTypes')],...['apartment','townhouse','plot'].map(k=>[k,t(k)])]);options($('fStage'),[['',t('allStages')],...['available','reserved','upcoming'].map(k=>[k,t(k)])]);options($('fBudget'),[['',t('anyBudget')],['250',t('under250')],['400',t('under400')],['401',t('over400')]]);options($('requestProject'),projects.map((p,i)=>[String(i),p.name]))}
function renderUnits(){const p=$('fProject').value,type=$('fType').value,stage=$('fStage').value,budget=$('fBudget').value;const list=units.filter(u=>(p===''||u[1]===+p)&&(!type||u[2]===type)&&(!stage||u[3]===stage)&&(!budget||(budget==='250'?u[6]<=250:budget==='400'?u[6]<=400:u[6]>400)));$('count').textContent=list.length+' '+t('unitsFound');$('units').innerHTML=list.length?list.map(u=>`<article class="unit"><div class="unit-top"><strong class="unit-code">${u[0]}</strong><span class="unit-status">${esc(t(u[3]))}</span></div><p>${projects[u[1]].name} · ${esc(t(u[2]))}</p><div class="unit-detail"><span>${u[2]==='plot'?'':u[4]+' '+esc(t('beds'))+' · '}${u[5]} ${esc(t('sqm'))}</span><span>$${u[6]}k</span></div><button type="button" data-unit="${u[0]}">${esc(t('viewUnit'))}</button></article>`).join(''):`<p class="noresults">${esc(t('noResults'))}</p>`;$('units').querySelectorAll('button').forEach(b=>b.onclick=()=>openUnit(units.find(u=>u[0]===b.dataset.unit)))}
function renderSteps(){$('steps').innerHTML=[1,2,3,4].map(i=>`<article class="step"><span>0${i}</span><h3>${esc(t('step'+i))}</h3><p>${esc(t('step'+i+'Body'))}</p></article>`).join('')}
function applyLang(next){lang=I18N[next]?next:'en';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').value=lang;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));$('theme').setAttribute('aria-label',t('themeLabel'));$('menu').setAttribute('aria-label',t('menuLabel'));$('closeModal').setAttribute('aria-label',t('close'));renderProjects();renderFilters();renderUnits();renderSteps()}
function openUnit(u){$('modalTitle').textContent=u[0]+' · '+projects[u[1]].name;$('modalText').textContent=t(u[2])+' · '+t(u[3])+' · '+u[5]+' '+t('sqm')+' · '+t('from')+' $'+u[6]+'k. '+t('detailLine');$('modal').hidden=false;$('closeModal').focus();$('modalAction').onclick=()=>{$('requestProject').value=String(u[1]);closeModal()}}
function closeModal(){$('modal').hidden=true}
$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('lang').onchange=e=>applyLang(e.target.value);$('theme').onclick=()=>{let v=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=v;try{localStorage.setItem('atlas-theme',v)}catch(e){}};$('menu').onclick=()=>{let open=$('nav').classList.toggle('open');$('menu').setAttribute('aria-expanded',open)};document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{$('nav').classList.remove('open');$('menu').setAttribute('aria-expanded','false')});['fProject','fType','fStage','fBudget'].forEach(id=>$(id).onchange=renderUnits);$('request').onsubmit=e=>{e.preventDefault();$('formStatus').textContent=t('formSuccess');$('request').reset()};$('top').onclick=()=>scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',()=>{$('top').classList.toggle('show',scrollY>550)},{passive:true});$('year').textContent=new Date().getFullYear();let initial=(navigator.language||'en').toLowerCase().split('-')[0];applyLang(initial);if('IntersectionObserver'in window){let observer=new IntersectionObserver(entries=>entries.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');observer.unobserve(x.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(el=>observer.observe(el))}else document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
</script></body></html>
